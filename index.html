<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DeadArt</title>
<meta name="description" content="Il cantiere delle opere in corso e l'archivio delle opere che non ci sono più. Di Maurizio D'Andrea.">
<meta name="theme-color" content="#FAF6EC">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --carta:#FAF6EC; --bianco:#FFFCF5; --nero:#0B0B0B; --grigio:#5A554C;
  --rosso:#D22B1E; --giallo:#F5B301; --linea:#0B0B0B;
  --disp:"Archivo Black",Impact,"Arial Black",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--carta);color:var(--nero)}
body{font-family:var(--mono);font-size:16px;line-height:1.55;padding-bottom:118px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:660px;margin:0 auto;padding:0 18px}

/* splash */
#splash{position:fixed;inset:0;z-index:200;background:var(--nero);display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:24px;transition:opacity .5s ease}
#splash.via{opacity:0;pointer-events:none}
#splash svg{width:140px;height:140px}
#splash path{stroke:var(--rosso);stroke-width:2.4;fill:none;stroke-linecap:round;
 stroke-dasharray:1400;stroke-dashoffset:1400;animation:traccia 1.4s cubic-bezier(.4,0,.2,1) forwards}
@keyframes traccia{to{stroke-dashoffset:0}}
#splash .n{font-family:var(--disp);font-size:46px;letter-spacing:-.02em;color:var(--carta);opacity:0;animation:vieni .6s .7s forwards}
#splash .n i{font-style:normal;color:var(--giallo)}
#splash .s{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--giallo);opacity:0;animation:vieni .6s 1s forwards;text-align:center;padding:0 28px}
@keyframes vieni{to{opacity:1}}

/* testata */
header{background:var(--nero);margin:0 -18px;padding:26px 18px 20px;position:relative;overflow:hidden}
header .spir{position:absolute;right:-56px;top:-46px;width:190px;height:190px;opacity:.5;pointer-events:none}
.marchio{font-family:var(--disp);font-size:clamp(36px,12vw,52px);line-height:.92;letter-spacing:-.025em;color:var(--carta);position:relative}
.marchio i{font-style:normal;color:var(--giallo)}
.sotto{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--giallo);margin-top:10px;position:relative}
nav{display:flex;gap:0;margin:0 -18px 0;background:var(--nero);overflow-x:auto;scrollbar-width:none;border-top:1px solid #262626}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;padding:13px 15px;font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.1em;
 text-transform:uppercase;color:#B8B2A6;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--nero);background:var(--giallo)}
nav .dot{display:inline-block;min-width:17px;padding:1px 5px;margin-left:6px;background:var(--rosso);color:#fff;font-size:10px;border-radius:9px}

h2{font-family:var(--disp);font-size:27px;letter-spacing:-.02em;margin:24px 0 6px;line-height:1.1}
.occhiello{display:inline-block;background:var(--nero);color:var(--giallo);font-size:10px;font-weight:600;letter-spacing:.15em;
 text-transform:uppercase;padding:4px 9px;margin-top:28px}
.grigio{color:var(--grigio)}
p{margin:0 0 14px}

.stat{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--nero);margin-top:18px;background:var(--bianco)}
.stat div{padding:14px 3px;text-align:center;border-right:1px solid var(--nero)}
.stat div:last-child{border-right:0}
.stat b{display:block;font-family:var(--disp);font-size:29px;line-height:1}
.stat span{display:block;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);margin-top:6px}

.grid{columns:2;column-gap:12px;margin-top:18px}
@media(max-width:380px){.grid{columns:1}}
.card{break-inside:avoid;margin-bottom:12px;background:var(--bianco);border:2px solid var(--nero);cursor:pointer;position:relative;overflow:hidden}
.card:active{transform:translate(1px,1px)}
.card img{display:block;width:100%;height:auto;border-bottom:2px solid var(--nero)}
.card .noimg{aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:var(--linea);font-size:40px;border-bottom:2px solid var(--nero)}
.card .bd{padding:11px 12px 13px}
.parola{font-family:var(--disp);font-size:24px;line-height:1.02;letter-spacing:-.02em;word-break:break-word}
.parola.vuota{color:var(--rosso);font-size:19px}
.meta{font-size:11px;font-weight:500;color:var(--grigio);margin-top:7px}
.bollo{position:absolute;top:0;left:0;background:var(--giallo);color:var(--nero);border-right:2px solid var(--nero);border-bottom:2px solid var(--nero);padding:4px 9px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.bollo.rosso{background:var(--rosso);color:#fff}
.pile{position:absolute;top:0;right:0;background:var(--nero);color:var(--carta);padding:4px 9px;font-size:10px;font-weight:600}

.vuoto{border:2px dashed var(--nero);background:var(--bianco);padding:44px 20px;text-align:center;margin-top:20px}
.vuoto p{font-family:var(--disp);font-size:22px;margin:0 0 10px;line-height:1.15}
.vuoto span{font-size:14px;color:var(--grigio)}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:40;background:var(--rosso);color:#fff;
 border:2px solid var(--nero);padding:15px 26px;font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.12em;
 text-transform:uppercase;cursor:pointer;box-shadow:4px 4px 0 var(--nero)}
.fab:active{transform:translateX(-50%) translate(2px,2px);box-shadow:2px 2px 0 var(--nero)}
.btn{display:block;width:100%;background:var(--nero);color:var(--carta);border:2px solid var(--nero);padding:15px;margin-top:20px;
 font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-align:center;text-decoration:none}
.btn.giallo{background:var(--giallo);color:var(--nero)}
.btn.rossa{background:var(--rosso);color:#fff}
.btn.ghost{background:var(--bianco);color:var(--nero)}

.sheet{position:fixed;inset:0;background:var(--carta);z-index:60;overflow-y:auto;display:none}
.sheet.on{display:block}
.bar{position:sticky;top:0;background:var(--nero);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 18px;z-index:5}
.bar b{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--giallo)}
.bar button{background:none;border:0;color:var(--carta);font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:4px 0}
.bar button.modi{color:var(--giallo)}
.in{padding:18px 18px 130px;max-width:660px;margin:0 auto}

label{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--nero);margin:22px 0 7px}
input,textarea,select{width:100%;padding:13px;border:2px solid var(--nero);background:var(--bianco);
 font-family:var(--mono);font-size:16px;color:var(--nero);border-radius:0;appearance:none}
input::placeholder,textarea::placeholder{color:#8C867A}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:0;box-shadow:inset 0 0 0 2px var(--rosso)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--nero) 50%),linear-gradient(135deg,var(--nero) 50%,transparent 50%);
 background-position:calc(100% - 19px) 22px,calc(100% - 13px) 22px;background-size:6px 6px;background-repeat:no-repeat}
.due{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--bianco);border:2px solid var(--nero);color:var(--nero);padding:8px 12px;font-family:var(--mono);font-size:13px;cursor:pointer}
.chip.on{background:var(--rosso);color:#fff}
.nota{font-size:13px;color:var(--grigio);margin-top:8px;line-height:1.5}

.rullino{display:flex;gap:9px;flex-wrap:wrap}
.rullino .t{width:82px;height:82px;background:#DDD8CC center/cover;border:2px solid var(--nero);position:relative}
.rullino .t button{position:absolute;top:-9px;right:-9px;width:24px;height:24px;border:2px solid var(--nero);background:var(--rosso);color:#fff;font-size:13px;line-height:1;cursor:pointer;padding:0}
.piu{width:82px;height:82px;border:2px dashed var(--nero);background:var(--bianco);color:var(--nero);font-size:11px;font-weight:600;
 font-family:var(--mono);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px}

.hero{width:100%;display:block;border:2px solid var(--nero)}
.foto{margin-bottom:14px}
.scarica{display:inline-block;background:var(--giallo);border:2px solid var(--nero);border-top:0;color:var(--nero);
 font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;padding:7px 13px}
.dparola{font-family:var(--disp);font-size:clamp(34px,11vw,50px);line-height:.98;letter-spacing:-.03em;margin:18px 0 6px}
.dparola.vuota{color:var(--rosso);font-size:28px}
.riga{display:inline-block;background:var(--nero);color:var(--giallo);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px}
.dl{border:2px solid var(--nero);margin-top:20px;background:var(--bianco)}
.dl .r{display:grid;grid-template-columns:118px 1fr;gap:12px;padding:11px 12px;border-bottom:1px solid var(--nero)}
.dl .r:last-child{border-bottom:0}
.dl dt{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);padding-top:3px}
.dl dd{margin:0;font-size:15px}
audio{width:100%;margin-top:10px}

.fase{border:2px solid var(--nero);background:var(--bianco);margin-bottom:16px}
.fase .cap{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--nero);color:var(--carta);padding:8px 11px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.fase .cap i{font-style:normal;color:var(--giallo)}
.fase img{width:100%;display:block;border-bottom:2px solid var(--nero)}
.fase .nm{font-family:var(--disp);font-size:20px;padding:11px 12px 0;line-height:1.15}
.fase .tx{font-size:14.5px;padding:6px 12px 12px;line-height:1.5}
.fase .az{display:flex;border-top:2px solid var(--nero)}
.fase .az a,.fase .az button{flex:1;text-align:center;padding:10px 4px;font-family:var(--mono);font-size:11px;font-weight:600;
 letter-spacing:.08em;text-transform:uppercase;background:var(--bianco);border:0;border-right:2px solid var(--nero);color:var(--nero);text-decoration:none;cursor:pointer}
.fase .az :last-child{border-right:0}
.fase .az a{background:var(--giallo)}
.fase .az .canc{color:var(--rosso)}
.avanz{height:10px;border:2px solid var(--nero);background:var(--bianco);margin:16px 0 0}
.avanz i{display:block;height:100%;background:var(--rosso)}

.dec{border:3px solid var(--rosso);background:var(--bianco);padding:24px 20px;margin-top:20px}
.dec .q{font-family:var(--disp);font-size:34px;line-height:1.02;margin:0 0 12px;letter-spacing:-.02em}
.dec .sub{font-size:14px;color:var(--nero);margin:0 0 18px;line-height:1.55}
.dec input{font-family:var(--disp);font-size:28px;text-align:center;padding:14px}
.reg{margin-top:13px}
.reg button{width:100%;background:var(--bianco);border:2px solid var(--nero);color:var(--nero);padding:13px;font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.reg button.live{background:var(--rosso);color:#fff}
.prog{height:6px;border:2px solid var(--nero);margin-top:11px;background:var(--bianco)}
.prog i{display:block;height:100%;width:0;background:var(--rosso);transition:width .1s linear}

.cart{border:2px solid var(--nero);background:var(--bianco);padding:15px 16px;margin-top:11px;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cart b{font-family:var(--disp);font-size:21px;letter-spacing:-.02em}
.cart span{font-size:11px;font-weight:600;color:var(--grigio);white-space:nowrap}

.info p{font-size:16px;line-height:1.65}
.info strong{background:var(--giallo);padding:0 3px}
.firma{font-family:var(--disp);font-size:24px;margin-top:26px;line-height:1.15}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--nero);color:var(--giallo);padding:13px 20px;
 font-size:12.5px;font-weight:600;z-index:110;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1}
a{color:var(--rosso)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash"><svg viewBox="0 0 200 200"><path id="sp2"/></svg>
 <div class="n">Dead<i>Art</i></div><div class="s">il cantiere e l'archivio</div></div>
<div class="wrap">
  <header>
    <svg class="spir" viewBox="0 0 200 200"><path id="sp" fill="none" stroke="#D22B1E" stroke-width="2"/></svg>
    <div class="marchio">Dead<i>Art</i></div>
    <div class="sotto">le opere in corso e quelle che non ci sono più</div>
  </header>
  <nav>
    <button data-t="cant" class="on">Cantiere</button>
    <button data-t="arch">Archivio</button>
    <button data-t="prog">Cartelle</button>
    <button data-t="dec">Decantazione<span class="dot" id="badge" style="display:none">0</span></button>
    <button data-t="info">Info</button>
    <button data-t="priv">Privacy</button>
  </nav>
  <div id="view"></div>
</div>
<button class="fab" id="fab">+ nuova</button>
<div class="sheet" id="sheet"><div class="bar"><button id="sClose">← Chiudi</button><b id="sTitle"></b><button id="sAct" class="modi" style="visibility:hidden">Modifica</button></div><div class="in" id="sIn"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== DeadArt — Maurizio D'Andrea — app libera ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=864e5, ATTESA=7*D, FINESTRA=8*D, MAXBYTE=1024*1024;
let items=[], tab='cant', draft=null, rec=null, editId=null;
const now=()=>Date.now();
const it=d=>d?new Date(d).toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'}):'';
const oggi=()=>new Date().toISOString().slice(0,10);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2400)};
const slug=s=>(s||'opera').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
const misure=i=>(i.base&&i.altezza)?i.base+'×'+i.altezza+' cm':'';

const DESTINI=['distrutta','coperta','abbandonata','smarrita','cancellata','sparita'];
const TECNICHE=['olio su tela','acrilico','tecnica mista','china su carta','acquerello','collage','digitale'];
const SUPPORTI=['tela','tavola','carta','cartone','muro','file'];
const FASI=['prima seduta','a metà','quasi finita','finita'];

function spirale(el,g){let d='';for(let t=0;t<44;t+=.04){const r=.08*Math.exp(.19*t)*g;
 const x=100+r*Math.cos(t),y=100+r*Math.sin(t);if(r>92)break;d+=(d?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}el.setAttribute('d',d)}
spirale($('#sp'),22); spirale($('#sp2'),21);

/* ===== archivio locale ===== */
const vuotoMedia=()=>({photos:[],audio:null,voce:null,fasi:[]});
const Store=(()=>{
  const ws = typeof window.storage!=='undefined' && window.storage;
  let db=null;
  const open=()=>new Promise((ok,ko)=>{const r=indexedDB.open('deadart',2);
    r.onupgradeneeded=e=>{const d=e.target.result;
      if(!d.objectStoreNames.contains('items'))d.createObjectStore('items',{keyPath:'id'});
      if(!d.objectStoreNames.contains('media'))d.createObjectStore('media');
      if(!d.objectStoreNames.contains('conf'))d.createObjectStore('conf')};
    r.onsuccess=e=>{db=e.target.result;ok()};r.onerror=()=>ko(r.error)});
  const st=(s,m)=>db.transaction(s,m).objectStore(s);
  const p=q=>new Promise((ok,ko)=>{q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)});
  return {
    modo: ws?'anteprima':'dispositivo',
    async init(){ if(!ws) await open(); },
    async tutti(){ if(ws){try{return JSON.parse((await window.storage.get('deadart:index')).value)}catch(e){return[]}}
      return (await p(st('items').getAll())).sort((a,b)=>a.createdAt-b.createdAt); },
    async salva(o){ if(ws) return window.storage.set('deadart:index',JSON.stringify(items)); if(o) await p(st('items','readwrite').put(o)); },
    async togli(id){ if(ws) return window.storage.set('deadart:index',JSON.stringify(items)); await p(st('items','readwrite').delete(id)); },
    async media(id){ if(ws){try{return JSON.parse((await window.storage.get('deadart:media:'+id)).value)}catch(e){return vuotoMedia()}}
      return (await p(st('media').get(id)))||vuotoMedia(); },
    async setMedia(id,m){ if(ws) return window.storage.set('deadart:media:'+id,JSON.stringify(m)); await p(st('media','readwrite').put(m,id)); },
    async delMedia(id){ if(ws){try{await window.storage.delete('deadart:media:'+id)}catch(e){} return} await p(st('media','readwrite').delete(id)); }
  };
})();

/* ===== immagini sempre sotto 1 MB ===== */
const leggi=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
const carica=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u});
function rid(im,lato,q){const s=Math.min(1,lato/Math.max(im.width,im.height));
 const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
 const x=c.getContext('2d');x.fillStyle='#FFFCF5';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
 return c.toDataURL('image/jpeg',q)}
const peso=u=>Math.round(u.length*3/4);
async function comprimi(file){
  const im=await carica(await leggi(file));
  let lato=1800,q=.84,out=rid(im,lato,q);
  while(peso(out)>MAXBYTE&&q>.42){q-=.08;out=rid(im,lato,q)}
  while(peso(out)>MAXBYTE&&lato>700){lato=Math.round(lato*.82);out=rid(im,lato,.72)}
  return {full:out,thumb:rid(im,420,.62),ratio:+(im.width/im.height).toFixed(3)};
}
function daDataUrl(u){const [t,b]=u.split(',');const mime=(t.match(/:(.*?);/)||[])[1]||'application/octet-stream';
  const bin=atob(b);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime})}
async function condividi(dataUrl,nome,testo){
  const blob = typeof dataUrl==='string' && dataUrl.startsWith('data:') ? daDataUrl(dataUrl) : dataUrl;
  const file = new File([blob], nome, {type:blob.type||'application/octet-stream'});
  // 1. condivisione di sistema (Chrome, PWA installata)
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:nome, text:testo||nome}); return } }
  catch(e){ if(e && e.name==='AbortError') return; }
  // 2. salvataggio classico
  let scaricato=false;
  try{ const a=document.createElement('a'); const url=URL.createObjectURL(blob);
    if('download' in a){ a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),6000); scaricato=true; } }catch(e){}
  // 3. finestra: l'immagine a schermo, si tiene premuto e si salva
  if(!scaricato || /Android/i.test(navigator.userAgent)){ mostraSalvataggio(dataUrl,nome,blob,scaricato) }
  else toast('Salvata: '+nome);
}
function mostraSalvataggio(dataUrl,nome,blob,scaricato){
  const url = (typeof dataUrl==='string'&&dataUrl.startsWith('data:')) ? dataUrl : URL.createObjectURL(blob);
  const immagine = (blob.type||'').startsWith('image/');
  const d=document.createElement('div'); d.id='salvaBox';
  d.style.cssText='position:fixed;inset:0;z-index:300;background:#0B0B0B;overflow-y:auto;padding:18px;color:#FAF6EC;font-family:var(--mono)';
  d.innerHTML=`<div style="max-width:620px;margin:0 auto">
    <div style="font-family:var(--disp);font-size:24px;line-height:1.15;margin-bottom:6px">Salva questa ${immagine?'immagine':'copia'}</div>

function vCant(){

function cardCant(c){
  const im=c.thumb?`<img src="${c.thumb}" alt="" loading="lazy" style="aspect-ratio:${c.ratio||1}">`:`<div class="noimg">◌</div>`;
  const m=[misure(c),c.anno].filter(Boolean).join(' · ');
  return `<div class="card" data-id="${c.id}">${im}

function vArch(){
  const l=scarti();
  if(!l.length)return `<div class="vuoto"><p>Non hai ancora perso niente.</p><span>La prossima volta che copri o butti qualcosa, fotografala prima.</span></div>`;
  const p=l.filter(i=>i.parola).length, d=l.filter(i=>i.dimenticata).length;
  const g=l.filter(i=>i.vita!=null).map(i=>i.vita);
  const m=g.length?Math.round(g.reduce((a,b)=>a+b,0)/g.length):null;
  return `<div class="stat"><div><b>${l.length}</b><span>schede</span></div><div><b>${p}</b><span>parole</span></div>

function carta(i){
  const pronta=now()>=i.createdAt+ATTESA, gg=Math.max(0,Math.ceil((i.createdAt+ATTESA-now())/D));

  const t=i.parola?`<div class="parola">${esc(i.parola)}</div>`
   :i.dimenticata?`<div class="parola vuota">dimenticata</div>`
   :`<div class="parola" style="font-size:19px">${esc(i.titolo||'senza titolo')}</div>`;
  const im=i.thumb?`<img src="${i.thumb}" alt="" loading="lazy" style="aspect-ratio:${i.ratio||1}">`:`<div class="noimg">◌</div>`;
  const m=[i.destino,misure(i),i.anno].filter(Boolean).join(' · ');
  return `<div class="card" data-id="${i.id}">${im}${bollo}${i.nFoto>1?`<div class="pile">${i.nFoto} img</div>`:''}
   <div class="bd">${t}<div class="meta">${esc(m)}</div></div></div>`;
}

function rullino(multi){
  const dis=()=>{ $('#rl').innerHTML=draft.photos.map((p,n)=>`<div class="t" style="background-image:url(${p})"><button data-n="${n}">×</button></div>`).join('')
    +((multi||!draft.photos.length)?`<button class="piu" id="pCam">scatta</button><button class="piu" id="pGal">galleria</button>`:'');
    const c=$('#pCam'),g=$('#pGal'); if(c)c.onclick=()=>$('#fCam').click(); if(g)g.onclick=()=>$('#fGal').click();
    $('#rl').querySelectorAll('.t button').forEach(b=>b.onclick=()=>{draft.photos.splice(+b.dataset.n,1);dis()}); };
  dis();
  const prendi=async e=>{ if(!e.target.files.length)return; toast('Sto rimpicciolendo…');
    for(const f of e.target.files){ if(draft.photos.length>=10){toast('Massimo 10 immagini');break}
      const r=await comprimi(f); draft.photos.push(r.full); if(!draft.thumb||draft.photos.length===1){draft.thumb=r.thumb;draft.ratio=r.ratio} }
    dis(); e.target.value=''; };
  $('#fCam').onchange=prendi; $('#fGal').onchange=prendi;
}

    tecnica:draft.tecnica||val('tecAltro'), supporto:draft.supporto||val('supAltro'), dataInizio:val('dInizio'),

  if(draft.thumb){d.thumb=draft.thumb;d.ratio=draft.ratio}
  if(editId){ const i=items.find(x=>x.id===editId); Object.assign(i,d); await Store.salva(i);
    const m=await Store.media(editId); m.audio=draft.audio||m.audio;
    if(draft.photos[0]&&!(m.fasi&&m.fasi.length)){ m.fasi=[{id:'f'+now(),ts:now(),nome:'apertura',nota:'',foto:draft.photos[0]}];

  else { const o=Object.assign({id:draft.id,createdAt:now(),chiuso:false,nFasi:0,ultima:null},d); items.push(o);

async function salvaScarto(){
  const ds=val('dScarto'), di=val('dInizio');
  const d={ tipo:'scarto', titolo:val('titolo'), anno:val('anno'), base:val('base'), altezza:val('alt'),
    tecnica:draft.tecnica||val('tecAltro'), supporto:draft.supporto||val('supAltro'), destino:draft.destino, fase:$('#fase')?$('#fase').value:'',
    copertaDa:$('#copertaDa')?$('#copertaDa').value:'', dataScarto:ds, dataInizio:di, ubicaz:val('ubicaz'), note:val('note'),
    titoliScartati:val('titoliScartati'), progetto:val('progetto'),
    vita:(ds&&di)?Math.max(0,Math.round((new Date(ds)-new Date(di))/D)):null,
    thumb:draft.thumb, ratio:draft.ratio, nFoto:draft.photos.length };
  if(editId){ const i=items.find(x=>x.id===editId); Object.assign(i,d); await Store.salva(i); }
  else { const o=Object.assign({id:draft.id,createdAt:now(),parola:null,dimenticata:false},d); items.push(o); await Store.salva(o); }
  const m=await Store.media(draft.id); m.photos=draft.photos; m.audio=draft.audio; await Store.setMedia(draft.id,m);
  chiudiSheet(); tab='arch'; render(); toast(editId?'Modificata.':'Archiviata. Torno tra sette giorni.');
}

/* ===== dettaglio cantiere ===== */
async function apriCantiere(id){
  const c=items.find(x=>x.id===id); if(!c)return;
  const m=await Store.media(id);
  const fasi=(m.fasi||[]).slice().sort((a,b)=>a.ts-b.ts);
  const gg=c.dataInizio?Math.round((now()-new Date(c.dataInizio))/D):null;
  const r=(k,v)=>v?`<div class="r"><dt>${k}</dt><dd>${esc(v)}</dd></div>`:'';
  apriSheet('Opera in corso',`
   <div class="dparola">${esc(c.titolo||'senza titolo')}</div>
   <div class="riga">${c.chiuso?'finita':'in corso'} · ${fasi.length} fasi${gg!=null?' · aperta da '+gg+' giorni':''}</div>
   <div class="dl">
     ${r('Anno',c.anno)}${r('Dimensioni',misure(c))}${r('Tecnica',c.tecnica)}${r('Supporto',c.supporto)}
     ${r('Iniziata il',it(c.dataInizio))}${r('Cartella',c.progetto)}${r('Intenzione',c.note)}</div>
   ${m.audio?`<label>Nota vocale dell'opera</label><audio controls src="${m.audio}"></audio>`:''}
   <div class="avanz"><i style="width:${Math.min(100,fasi.length*12)}%"></i></div>
   <button class="btn giallo" id="addFase">+ aggiungi una fase</button>
   <input type="file" id="fFase" accept="image/*" capture="environment" hidden>
   <div class="occhiello">Le fasi</div>
   <div style="margin-top:14px">${fasi.length?fasi.map((f,n)=>faseHTML(c,f,n)).join(''):'<p class="nota">Ancora nessuna fase. Scatta la prima.</p>'}</div>
   <button class="btn ghost" id="chiudi">${c.chiuso?'riapri il cantiere':'segna come finita'}</button>
   <button class="btn rossa" id="muore">è morta: mandala nell'archivio</button>
   <button class="btn ghost" id="del" style="color:#D22B1E">cancella l'opera</button>`, ()=>modificaCantiere(id));

  $('#addFase').onclick=()=>$('#fFase').click();
  $('#fFase').onchange=async e=>{ if(!e.target.files[0])return; toast('Sto rimpicciolendo…');
    const r2=await comprimi(e.target.files[0]);
    const nome=prompt('Come si chiama questa fase? (fondo, seconda mano, ho coperto tutto…)','')||'';
    const nota=prompt('Due parole su cosa è cambiato:','')||'';
    m.fasi=m.fasi||[]; m.fasi.push({id:'f'+now(),ts:now(),nome,nota,foto:r2.full});
    await Store.setMedia(id,m); c.nFasi=m.fasi.length; c.ultima=now(); if(!c.thumb){c.thumb=r2.thumb;c.ratio=r2.ratio}
    await Store.salva(c); apriCantiere(id); toast('Fase aggiunta.'); };

  $('#sIn').querySelectorAll('[data-cond]').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.cond, f=fasi[n];
    condividi(f.foto, slug(c.titolo)+'-fase-'+String(n+1).padStart(2,'0')+'.jpg',
      (c.titolo||'')+' — fase '+(n+1)+(f.nome?': '+f.nome:'')); });
  $('#sIn').querySelectorAll('[data-vocefase]').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.vocefase, f=fasi[n];
    const w=$('#pbar-w-'+n); if(w)w.style.display='block';
    registraSu(b, 60, 'pbar-'+n, async b64=>{
      const vera=m.fasi.find(x=>x.id===f.id); vera.audio=b64; await Store.setMedia(id,m);
      apriCantiere(id); toast('Voce aggiunta alla fase.'); }); });
  $('#sIn').querySelectorAll('[data-modfase]').forEach(b=>b.onclick=async()=>{
    const n=+b.dataset.modfase, f=fasi[n];
    const nome=prompt('Nome della fase:',f.nome||''); if(nome===null)return;
    const nota=prompt('Nota:',f.nota||''); if(nota===null)return;
    const vera=m.fasi.find(x=>x.id===f.id); vera.nome=nome; vera.nota=nota;
    await Store.setMedia(id,m); apriCantiere(id); toast('Fase modificata.'); });
  $('#sIn').querySelectorAll('[data-delfase]').forEach(b=>b.onclick=async()=>{
    const f=fasi[+b.dataset.delfase]; if(!confirm('Cancellare questa fase?'))return;
    m.fasi=m.fasi.filter(x=>x.id!==f.id); await Store.setMedia(id,m);
    c.nFasi=m.fasi.length; c.ultima=m.fasi.length?m.fasi[m.fasi.length-1].ts:null; await Store.salva(c);
    apriCantiere(id); toast('Fase cancellata.'); });

  $('#chiudi').onclick=async()=>{ c.chiuso=!c.chiuso; await Store.salva(c); chiudiSheet(); render(); toast(c.chiuso?'Segnata come finita.':'Riaperta.'); };
  $('#muore').onclick=async()=>{ if(!confirm('Mandare questa opera nell\'archivio delle opere che non ci sono più? Le fasi la seguono.'))return;
    c.tipo='scarto'; c.parola=null; c.dimenticata=false; c.createdAt=now(); c.destino='abbandonata'; c.dataScarto=oggi();
    c.vita=c.dataInizio?Math.max(0,Math.round((now()-new Date(c.dataInizio))/D)):null;
    const mm=await Store.media(id); mm.photos=(mm.fasi||[]).map(f=>f.foto); c.nFoto=mm.photos.length;
    await Store.setMedia(id,mm); await Store.salva(c); chiudiSheet(); tab='arch'; render(); toast('Passata all\'archivio. Decanta sette giorni.'); };
  $('#del').onclick=()=>cancella(id);
}
function faseHTML(c,f,n){
  return `<div class="fase">
   <div class="cap"><span>fase ${n+1}</span><i>${it(f.ts)}</i></div>
   <img src="${f.foto}" alt="" loading="lazy">
   <div class="nm">${esc(f.nome||'senza nome')}</div>
   ${f.nota?`<div class="tx">${esc(f.nota)}</div>`:'<div style="height:10px"></div>'}
   ${f.audio?`<div style="padding:0 12px 12px"><audio controls src="${f.audio}"></audio></div>`:''}
   <div class="az"><a data-cond="${n}">condividi ↗</a><button data-vocefase="${n}">${f.audio?'rivoce':'voce'}</button><button data-modfase="${n}">modifica</button><button class="canc" data-delfase="${n}">elimina</button></div>
   <div class="prog" id="pbar-w-${n}" style="display:none;margin:0"><i id="pbar-${n}"></i></div></div>`;
}
async function modificaCantiere(id){ const i=items.find(x=>x.id===id); const m=await Store.media(id);
  draft={id,tipo:'cantiere',photos:(m.fasi&&m.fasi[0])?[m.fasi[0].foto]:[],thumb:i.thumb,ratio:i.ratio,audio:m.audio,tecnica:i.tecnica||'',supporto:i.supporto||''};
  editId=id; apriSheet('Modifica opera',moduloCantiere(i)); legaCantiere(); }

/* ===== dettaglio scarto ===== */
async function apriScarto(id){
  const i=items.find(x=>x.id===id); if(!i)return;
  const m=await Store.media(id);
  const cop=i.copertaDa?items.find(x=>x.id===i.copertaDa):null;
  const r=(k,v)=>v?`<div class="r"><dt>${k}</dt><dd>${esc(v)}</dd></div>`:'';
  const gg=Math.max(0,Math.ceil((i.createdAt+ATTESA-now())/D));
  apriSheet('Scheda',`
   ${(m.photos||[]).map((p,n)=>`<div class="foto"><img class="hero" src="${p}" alt=""><br><a class="scarica" data-cond="${n}">condividi ↗</a></div>`).join('')
     ||'<div class="vuoto"><p>Nessuna immagine.</p><span>Puoi aggiungerla dalla modifica.</span></div>'}
   <div class="dparola ${i.parola?'':'vuota'}">${esc(i.parola||(i.dimenticata?'dimenticata':(i.titolo||'senza titolo')))}</div>
   <div class="riga">${i.parola?esc(i.titolo||'senza titolo'):'in decantazione'}${(!i.parola&&!i.dimenticata)?' · ancora '+gg+' giorni':''}</div>
   <div class="dl">${r('Anno',i.anno)}${r('Dimensioni',misure(i))}${r('Che fine ha fatto',i.destino)}${r('Fase',i.fase)}
     ${r('Tecnica',i.tecnica)}${r('Supporto',i.supporto)}
     ${r('Scartata il',it(i.dataScarto))}${r('Sopravvissuta',i.vita!=null?i.vita+' giorni':'')}
     ${r('Ubicazione',i.ubicaz)}${r('Coperta da',cop?(cop.parola||cop.titolo||'senza titolo'):'')}
     ${r('Titoli scartati',i.titoliScartati)}${r('Cartella',i.progetto)}${r('Note',i.note)}${r('Archiviata il',it(i.createdAt))}</div>
   ${m.voce?`<label>I cinque secondi</label><audio controls src="${m.voce}"></audio>`:''}
   ${m.audio?`<label>Nota vocale</label><audio controls src="${m.audio}"></audio>`:''}
   <button class="btn rossa" id="del">cancella questa scheda</button>`, ()=>modificaScarto(id));
  $('#sIn').querySelectorAll('[data-cond]').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.cond; condividi(m.photos[n], slug(i.parola||i.titolo)+'-'+String(n+1).padStart(2,'0')+'.jpg',
      (i.parola||i.titolo||'opera')); });
  $('#del').onclick=()=>cancella(id);
}
async function modificaScarto(id){ const i=items.find(x=>x.id===id); const m=await Store.media(id);
  draft={id,tipo:'scarto',photos:(m.photos||[]).slice(),thumb:i.thumb,ratio:i.ratio,audio:m.audio,tecnica:i.tecnica||'',supporto:i.supporto||'',destino:i.destino||'',fase:i.fase||''};
  editId=id; apriSheet('Modifica scheda',moduloScarto(i)); legaScarto(); }

async function cancella(id){ if(!confirm('Cancellare per sempre? Immagini e registrazioni spariscono con lei.'))return;
  items=items.filter(x=>x.id!==id); await Store.togli(id); await Store.delMedia(id); chiudiSheet(); render(); toast('Cancellata.'); }

/* ===== voce ===== */
const registra=(btn,secs,fatto)=>registraSu(btn,secs,'pbar',fatto);
async function registraSu(btn,secs,barId,fatto){
  if(rec&&rec.state==='recording'){rec.stop();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast('Questa versione dell\'app non può usare il microfono'); return }
  if(typeof MediaRecorder==='undefined'){ toast('Registrazione non supportata su questo telefono'); return }
  let st;
  try{ st=await navigator.mediaDevices.getUserMedia({audio:true}) }
  catch(e){ const n=(e&&e.name)||'';
    toast( n==='NotAllowedError' ? 'Permesso microfono negato: autorizzalo nelle impostazioni'
         : n==='NotFoundError' ? 'Nessun microfono trovato'
         : n==='NotReadableError' ? 'Il microfono è occupato da un\'altra app'
         : 'Microfono non disponibile'+(n?' ('+n+')':'') ); return }
  const pz=[]; rec=new MediaRecorder(st); rec.ondataavailable=e=>pz.push(e.data);
  const t0=Date.now(), bar=document.getElementById(barId);
  const iv=setInterval(()=>{const p=(Date.now()-t0)/(secs*1000);if(bar)bar.style.width=Math.min(100,p*100)+'%';if(p>=1&&rec.state==='recording')rec.stop()},80);
  rec.onstop=()=>{clearInterval(iv);st.getTracks().forEach(t=>t.stop());btn.classList.remove('live');btn.textContent='registrata · rifai';
    const f=new FileReader();f.onload=()=>fatto(f.result);f.readAsDataURL(new Blob(pz,{type:'audio/webm'}))};
  btn.classList.add('live');btn.textContent='sto registrando · tocca per fermare';rec.start();
}

/* ===== sheet ===== */
function apriSheet(t,h,onAct){ $('#sTitle').textContent=t; $('#sIn').innerHTML=h; $('#sheet').classList.add('on'); $('#sheet').scrollTop=0;
  const a=$('#sAct'); if(onAct){a.style.visibility='visible';a.onclick=onAct}else{a.style.visibility='hidden';a.onclick=null} }
function chiudiSheet(){ $('#sheet').classList.remove('on'); draft=null; editId=null; }
const apri=id=>{const i=items.find(x=>x.id===id); if(!i)return; i.tipo==='cantiere'?apriCantiere(id):apriScarto(id)};

/* ===== eventi ===== */
function lega(){
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>apri(c.dataset.id));
  document.querySelectorAll('.cart').forEach(p=>p.onclick=()=>{
    const k=p.dataset.p, l=items.filter(i=>(i.progetto||'Senza cartella')===k).sort((a,b)=>b.createdAt-a.createdAt);
    apriSheet('Cartella',`<h2 style="margin-top:2px">${esc(k)}</h2><p class="grigio" style="font-size:14px">${l.length} schede</p>
      <div class="grid">${l.map(i=>i.tipo==='cantiere'?cardCant(i):carta(i)).join('')}</div>`);
    $('#sIn').querySelectorAll('.card').forEach(c=>c.onclick=()=>apri(c.dataset.id)); });
  const dec=document.querySelector('.dec');
  if(dec){ let voce=null;
    $('#mic').onclick=()=>registra($('#mic'),5,b=>{voce=b;$('#vplay').innerHTML=`<audio controls src="${b}"></audio>`});
    $('#sigilla').onclick=async()=>{ const w=($('#pw').value||'').trim().split(/\s+/)[0]; if(!w){toast('Serve una parola.');return}
      const i=items.find(x=>x.id===dec.dataset.id); i.parola=w; i.parolaAt=now(); await Store.salva(i);
      if(voce){const m=await Store.media(i.id);m.voce=voce;await Store.setMedia(i.id,m)} render(); toast('Sigillata: '+w); }; }
  const ex=$('#exp'); if(ex)ex.onclick=async()=>{
    if(!items.length){toast('Non c\'è ancora niente da salvare.');return}
    toast('Sto preparando la copia…');
    const out={app:'DeadArt',versione:1,data:new Date().toISOString(),items,media:{}};
    for(const i of items) out.media[i.id]=await Store.media(i.id);
    const blob=new Blob([JSON.stringify(out)],{type:'application/json'});
    await condividi(blob,'deadart-'+oggi()+'.json','Copia di sicurezza DeadArt'); };
  const im=$('#imp'); if(im)im.onclick=()=>$('#fImp').click();
  const fi=$('#fImp'); if(fi)fi.onchange=async e=>{
    const f=e.target.files[0]; if(!f)return; e.target.value='';
    try{
      const dati=JSON.parse(await f.text());
      if(!dati.items||!Array.isArray(dati.items)) throw new Error('formato');
      if(!confirm('Importare '+dati.items.length+' schede? Quelle già presenti con lo stesso identificativo verranno sostituite.'))return;
      toast('Sto importando…');
      for(const o of dati.items){
        if(!o.tipo)o.tipo='scarto';
        const g=items.findIndex(x=>x.id===o.id);
        if(g>=0) items[g]=o; else items.push(o);
        await Store.salva(o);
        if(dati.media&&dati.media[o.id]) await Store.setMedia(o.id,dati.media[o.id]);
      }
      render(); toast('Importate '+dati.items.length+' schede.');
    }catch(err){ toast('Il file non è una copia di DeadArt.'); } };
  const wp=$('#wipe'); if(wp)wp.onclick=async()=>{ if(!confirm('Cancellare tutto? Non si torna indietro.'))return;
    for(const i of items){await Store.togli(i.id);await Store.delMedia(i.id)} items=[]; if(Store.modo==='anteprima')await Store.salva();
    render(); toast('Archivio vuoto.') };
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo({top:0,behavior:'smooth'})});
$('#fab').onclick=nuova; $('#sClose').onclick=chiudiSheet;
addEventListener('keydown',e=>{if(e.key==='Escape')chiudiSheet()});

(async()=>{ await Store.init(); items=await Store.tutti(); items.forEach(i=>{if(!i.tipo)i.tipo='scarto'}); await scaduti(); render();
  setTimeout(()=>{const s=$('#splash');if(s){s.classList.add('via');setTimeout(()=>s.remove(),620)}},1800);
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{}); })();
</script>
