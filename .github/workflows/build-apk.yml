name: Compila APK DeadArt

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Prepara Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Raccogli i file dell'app dentro www
        run: |
          mkdir -p www/icons
          cp index.html privacy.html manifest.json sw.js www/
          cp icons/*.png www/icons/
          ls -la www

      - name: Installa Capacitor
        run: npm install

      - name: Crea il progetto Android
        run: npx cap add android

      - name: Installa il salvataggio nativo e i permessi
        run: |
          mkdir -p android/app/src/main/java/info/dandreart/deadart
          cp native/android/DeadArtFilePlugin.java android/app/src/main/java/info/dandreart/deadart/DeadArtFilePlugin.java
          cp native/android/MainActivity.java android/app/src/main/java/info/dandreart/deadart/MainActivity.java
          ls -la android/app/src/main/java/info/dandreart/deadart

      - name: Sincronizza i file dell'app
        run: npx cap sync android

      - name: Aggiungi i permessi di microfono e fotocamera
        run: |
          python3 - << 'PYPERM'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perms = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-feature android:name="android.hardware.camera" android:required="false" />',
              '<uses-feature android:name="android.hardware.microphone" android:required="false" />',
          ]
          mancanti = [x for x in perms if x.split('android:name="')[1].split('"')[0] not in s]
          if mancanti:
              s = s.replace('</manifest>', '    ' + '\n    '.join(mancanti) + '\n</manifest>')
              open(p,'w').write(s)
              print('Aggiunti:', len(mancanti))
          else:
              print('Permessi gia presenti')
          print(s)
          PYPERM

      - name: Guarda se c'e' una chiave di firma tua
        id: chiave
        env:
          K: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$K" ]; then
            echo "$K" | base64 -d > android/app/deadart-release.keystore
            if [ -s android/app/deadart-release.keystore ]; then
              echo "mia=si" >> $GITHUB_OUTPUT
              echo "Chiave personale trovata."
            else
              echo "mia=no" >> $GITHUB_OUTPUT
              echo "Il segreto c'e' ma il file e' vuoto: uso la chiave di prova."
            fi
          else
            echo "mia=no" >> $GITHUB_OUTPUT
            echo "Nessun segreto impostato: uso la chiave di prova di Android."
          fi

      - name: Firma con la chiave fissa
        if: steps.chiave.outputs.mia == 'si'
        run: |
          python3 - << 'PYSIGN'
          import re
          p='android/app/build.gradle'
          s=open(p).read()
          sign='''
              signingConfigs {
                  fissa {
                      storeFile file('deadart-release.keystore')
                      storePassword System.getenv('DEAD_STORE_PW')
                      keyAlias System.getenv('DEAD_KEY_ALIAS')
                      keyPassword System.getenv('DEAD_KEY_PW')
                  }
              }'''
          s=re.sub(r'android\s*\{', 'android {'+sign, s, count=1)
          if re.search(r'buildTypes\s*\{', s):
              s=re.sub(r'buildTypes\s*\{', 'buildTypes {\n        debug { signingConfig signingConfigs.fissa }', s, count=1)
          else:
              s=re.sub(r'(signingConfigs\s*\{[^}]*\}\s*\})', r'\1\n    buildTypes { debug { signingConfig signingConfigs.fissa } }', s, count=1)
          open(p,'w').write(s)
          print('--- build.gradle firmato con la chiave personale ---')
          PYSIGN

      - name: Compila l'APK
        env:
          DEAD_STORE_PW: ${{ secrets.MAIR_KEYSTORE_PASSWORD }}
          DEAD_KEY_ALIAS: ${{ secrets.MAIR_KEY_ALIAS }}
          DEAD_KEY_PW: ${{ secrets.MAIR_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Pubblica l'APK scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: DeadArt-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
