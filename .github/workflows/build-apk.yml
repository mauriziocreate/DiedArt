name: Compila DeadArt

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Prepara Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Leggi il numero di versione
        id: ver
        run: |
          NOME=$(cat VERSIONE 2>/dev/null | tr -d ' \n\r' || echo "1.0.0")
          CODICE=$(( 1000 + ${{ github.run_number }} ))
          echo "nome=$NOME"     >> $GITHUB_OUTPUT
          echo "codice=$CODICE" >> $GITHUB_OUTPUT
          echo "DeadArt $NOME (build $CODICE)"

      - name: Raccogli i file dell'app dentro www
        run: |
          mkdir -p www/icons
          cp index.html privacy.html manifest.json sw.js www/
          cp icons/*.png www/icons/
          ls -la www

      - name: Installa Capacitor
        run: npm install

      - name: Crea il progetto Android
        run: npx cap add android

      - name: Installa il salvataggio nativo
        run: |
          mkdir -p android/app/src/main/java/info/dandreart/deadart
          cp native/android/DeadArtFilePlugin.java android/app/src/main/java/info/dandreart/deadart/DeadArtFilePlugin.java
          cp native/android/MainActivity.java android/app/src/main/java/info/dandreart/deadart/MainActivity.java

      - name: Sincronizza i file dell'app
        run: npx cap sync android

      - name: Android API 35, richiesta da Google Play
        run: |
          python3 - << 'PYSDK'
          from pathlib import Path
          p = Path('android/variables.gradle')
          s = p.read_text()
          s = s.replace('compileSdkVersion = 34', 'compileSdkVersion = 35')
          s = s.replace('targetSdkVersion = 34', 'targetSdkVersion = 35')
          p.write_text(s)
          print(s)
          PYSDK

      - name: Tieni visibile la barra di stato su Android 15
        run: |
          python3 - << 'PYSTATUS'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = Path('android/app/src/main/res/values/styles.xml')
          destination = Path('android/app/src/main/res/values-v35/styles.xml')

          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(source)
          root = tree.getroot()

          wanted = {
              'android:windowOptOutEdgeToEdgeEnforcement': 'true',
              'android:windowDrawsSystemBarBackgrounds': 'true',
              'android:statusBarColor': '#0B0B0B',
              'android:windowLightStatusBar': 'false',
              'android:navigationBarColor': '#0B0B0B',
              'android:windowLightNavigationBar': 'false',
          }

          for style in root.findall('style'):
              if style.get('name') not in {'AppTheme.NoActionBar', 'AppTheme.NoActionBarLaunch'}:
                  continue
              existing = {item.get('name'): item for item in style.findall('item')}
              for name, value in wanted.items():
                  item = existing.get(name)
                  if item is None:
                      item = ET.SubElement(style, 'item', {'name': name})
                  item.text = value

          destination.parent.mkdir(parents=True, exist_ok=True)
          tree.write(destination, encoding='utf-8', xml_declaration=True)
          print(destination.read_text())
          PYSTATUS

      - name: Dichiara DeadArt come destinazione della condivisione
        run: |
          python3 - << 'PYSHARE'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          righe = [
              '                <intent-filter>',
              '                    <action android:name="android.intent.action.SEND" />',
              '                    <category android:name="android.intent.category.DEFAULT" />',
              '                    <data android:mimeType="text/plain" />',
              '                </intent-filter>',
              '                <intent-filter>',
              '                    <action android:name="android.intent.action.SEND" />',
              '                    <category android:name="android.intent.category.DEFAULT" />',
              '                    <data android:mimeType="image/*" />',
              '                </intent-filter>',
              '                <intent-filter>',
              '                    <action android:name="android.intent.action.SEND_MULTIPLE" />',
              '                    <category android:name="android.intent.category.DEFAULT" />',
              '                    <data android:mimeType="image/*" />',
              '                </intent-filter>',
              '            ',
          ]
          if 'android.intent.action.SEND' not in s:
              taglio = s.rindex('</activity>')
              s = s[:taglio] + chr(10).join(righe) + s[taglio:]
              open(p, 'w').write(s)
              print('filtri di condivisione aggiunti')
          else:
              print('filtri gia presenti')
          print(s)
          PYSHARE

      - name: Permessi di microfono e fotocamera
        run: |
          python3 - << 'PYPERM'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perms = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-feature android:name="android.hardware.camera" android:required="false" />',
              '<uses-feature android:name="android.hardware.microphone" android:required="false" />',
          ]
          mancanti = [x for x in perms if x.split('android:name="')[1].split('"')[0] not in s]
          if mancanti:
              s = s.replace('</manifest>', '    ' + '\n    '.join(mancanti) + '\n</manifest>')
              open(p,'w').write(s)
          print('permessi a posto')
          PYPERM

      - name: Ricrea il keystore dalle chiavi segrete
        id: chiave
        env:
          K1: ${{ secrets.KEYSTORE_BASE64 }}
          K2: ${{ secrets.DEADART_KEYSTORE }}
          K3: ${{ secrets.KEYSTORE }}
          P: ${{ secrets.MAIR_KEYSTORE_PASSWORD }}
          A: ${{ secrets.MAIR_KEY_ALIAS }}
          Q: ${{ secrets.MAIR_KEY_PASSWORD }}
        run: |
          # va bene uno qualsiasi dei tre nomi
          K="$K1"; [ -z "$K" ] && K="$K2"; [ -z "$K" ] && K="$K3"
          echo "--- controllo dei segreti ---"
          echo "KEYSTORE_BASE64:        ${#K1} caratteri"
          echo "DEADART_KEYSTORE:       ${#K2} caratteri"
          echo "KEYSTORE:               ${#K3} caratteri"
          echo "MAIR_KEYSTORE_PASSWORD: ${#P} caratteri"
          echo "MAIR_KEY_ALIAS:         ${#A} caratteri"
          echo "MAIR_KEY_PASSWORD:      ${#Q} caratteri"
          echo "-------------------------------------"

          MANCA=0
          [ -z "$K" ] && { echo "MANCA la chiave: nessuno dei nomi KEYSTORE_BASE64 / DEADART_KEYSTORE / KEYSTORE ha un valore"; MANCA=1; }
          [ -z "$P" ] && { echo "MANCA il segreto MAIR_KEYSTORE_PASSWORD"; MANCA=1; }
          [ -z "$A" ] && { echo "MANCA il segreto MAIR_KEY_ALIAS";         MANCA=1; }
          [ -z "$Q" ] && { echo "MANCA il segreto MAIR_KEY_PASSWORD";      MANCA=1; }
          if [ "$MANCA" = "1" ]; then
            echo ""
            echo "I segreti vanno impostati in QUESTO repository:"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "Non si ereditano da altri repository."
            exit 1
          fi

          # il base64 puo' arrivare spezzato su piu' righe: si ricompatta
          echo "$K" | tr -d ' \n\r' | base64 -d > android/app/deadart.keystore
          if [ ! -s android/app/deadart.keystore ]; then
            echo "La chiave c'e' ma non e' un keystore valido:"
            echo "il testo incollato non e' base64, oppure e' incompleto."
            echo "Rigeneralo e incollalo tutto, senza a capo."
            exit 1
          fi

          echo "Chiave di firma trovata: $(stat -c%s android/app/deadart.keystore) byte"
          keytool -list -keystore android/app/deadart.keystore -storepass "$P" -alias "$A" >/dev/null 2>&1 \
            && echo "Password e alias corrispondono." \
            || { echo "ERRORE: password o alias sbagliati per questo keystore."; exit 1; }
          echo "firma=si" >> $GITHUB_OUTPUT

      - name: Scrivi versione e firma dentro build.gradle
        env:
          FIRMA: ${{ steps.chiave.outputs.firma }}
          VNOME: ${{ steps.ver.outputs.nome }}
          VCOD: ${{ steps.ver.outputs.codice }}
        run: |
          python3 - << 'PYGRADLE'
          import os, re
          p='android/app/build.gradle'
          s=open(p).read()

          # numero di versione
          s=re.sub(r'versionCode\s+\d+', 'versionCode '+os.environ['VCOD'], s, count=1)
          s=re.sub(r'versionName\s+"[^"]*"', 'versionName "'+os.environ['VNOME']+'"', s, count=1)

          if os.environ.get('FIRMA')=='si':
              sign = '''
              signingConfigs {
                  rilascio {
                      storeFile file('deadart.keystore')
                      storePassword System.getenv('DEAD_STORE_PW')
                      keyAlias System.getenv('DEAD_KEY_ALIAS')
                      keyPassword System.getenv('DEAD_KEY_PW')
                  }
              }'''
              s = re.sub(r'android\s*\{', 'android {'+sign, s, count=1)
              # sia release che debug firmati con la stessa chiave
              s = re.sub(r'buildTypes\s*\{',
                         'buildTypes {\n        debug { signingConfig signingConfigs.rilascio }',
                         s, count=1)
              s = re.sub(r'release\s*\{',
                         'release {\n            signingConfig signingConfigs.rilascio\n            minifyEnabled false',
                         s, count=1)
          open(p,'w').write(s)
          print(s[s.find('android'):s.find('android')+900])
          PYGRADLE

      - name: Compila APK e pacchetto per il Play Store
        env:
          DEAD_STORE_PW: ${{ secrets.MAIR_KEYSTORE_PASSWORD }}
          DEAD_KEY_ALIAS: ${{ secrets.MAIR_KEY_ALIAS }}
          DEAD_KEY_PW: ${{ secrets.MAIR_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease assembleRelease
          echo "--- file prodotti ---"
          find app/build/outputs -name "*.aab" -o -name "*.apk" | sort

      - name: Rinomina i file con la versione
        run: |
          V="${{ steps.ver.outputs.nome }}-${{ steps.ver.outputs.codice }}"
          mkdir -p consegna
          cp android/app/build/outputs/apk/debug/app-debug.apk "consegna/DeadArt-prova-$V.apk" 2>/dev/null || true
          cp android/app/build/outputs/apk/release/app-release.apk "consegna/DeadArt-$V.apk" 2>/dev/null || true
          cp android/app/build/outputs/bundle/release/app-release.aab "consegna/DeadArt-$V.aab" 2>/dev/null || true
          ls -la consegna
          if ! ls consegna/*.aab >/dev/null 2>&1; then
            echo "ERRORE: il pacchetto .aab non e' stato prodotto."
            exit 1
          fi

      - name: Pubblica i file scaricabili
        uses: actions/upload-artifact@v4
        with:
          name: DeadArt-${{ steps.ver.outputs.nome }}-${{ steps.ver.outputs.codice }}
          path: consegna/*
          if-no-files-found: error
